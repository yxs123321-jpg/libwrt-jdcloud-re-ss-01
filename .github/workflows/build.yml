name: Build LibWrt JDCloud RE-SS-01

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt
  REPO_BRANCH: 25.12-nss
  TARGET_DIR: qualcommax/ipq60xx

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build environment
        run: |
          sudo apt-get update
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Clone LibWrt source
        run: |
          git clone -b "$REPO_BRANCH" --depth 1 --single-branch "$REPO_URL" openwrt

      - name: Add third-party feed
        run: |
          cd openwrt
          echo "src-git kenzok8 https://github.com/kenzok8/small-package" >> feeds.conf.default
          echo "src-git run https://github.com/wukongdaily/luci-app-run" >> feeds.conf.default
          echo "src-git vnt2 https://github.com/whzhni1/luci-app-vnt2" >> feeds.conf.default
          # liquid 主题不走 feeds 机制，改为直接 clone 进 package 目录，
          # 避免和 kenzok8/small-package 里可能存在的同名包产生冲突。
          # echo "src-git oaf https://github.com/destan19/OpenAppFilter" >> feeds.conf.default

      - name: Clone luci-theme-liquid directly into package/
        run: |
          rm -rf openwrt/package/luci-theme-liquid
          git clone --depth 1 https://github.com/zzsj0928/luci-theme-liquid openwrt/package/luci-theme-liquid

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config and customize
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/.config" .config
          bash "$GITHUB_WORKSPACE/diy.sh"

      - name: Resolve full config
        run: |
          cd openwrt
          make defconfig
          echo "== luci-theme-liquid config check =="
          grep -n "luci-theme-liquid" .config || echo "!! luci-theme-liquid 未出现在 .config 中，请检查包名/依赖 !!"

      - name: Download sources
        run: |
          cd openwrt
          make download -j"$(nproc)"

      - name: Build firmware
        run: |
          cd openwrt
          make -j"$(nproc)" V=s

      - name: Collect firmware
        run: |
          mkdir -p "$GITHUB_WORKSPACE/firmware"
          cp "openwrt/bin/targets/$TARGET_DIR"/*.bin "$GITHUB_WORKSPACE/firmware/" 2>/dev/null || true
          cp "openwrt/bin/targets/$TARGET_DIR"/*.manifest "$GITHUB_WORKSPACE/firmware/" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/firmware/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdcloud_re-ss-01_libwrt
          path: firmware/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/*
          tag_name: v${{ github.run_number }}
          name: LibWrt JDCloud RE-SS-01 (build ${{ github.run_number }})
          body: |
            京东云无线宝亚瑟 RE-SS-01 (IPQ6000 · 满血 NSS)
            - **uboot 刷入版本**：`squashfs-factory.bin`
            - **在线升级版本**：`squashfs-sysupgrade.bin`
            - 默认后台：`192.168.50.1`  用户：`root`  密码：`admin@cd`
            - **主题**：luci-theme-liquid
            - **编译时间**：${{ github.event.workflow_run.created_at }}
            - **代理**：dae 用run安装器安装run版本控制面板 选[aarch64_cortex-a53]版本(https://github.com/wkccd/luci-app-daed-runfiles/releases)
            - **异地组网**：[vnt2](https://github.com/whzhni1/luci-app-vnt2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}